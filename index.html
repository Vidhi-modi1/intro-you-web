    <!-- Helper script to format button casing, order, and handle Show details link redirect -->
    <script>
      (function() {
        function setupCookiebotBanner() {
          var dialog = document.getElementById('CybotCookiebotDialog');
          if (!dialog) return;

          var acceptBtn = document.getElementById('CybotCookiebotDialogBodyButtonAccept') || 
                          document.getElementById('CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll');
          if (acceptBtn && acceptBtn.textContent.trim().toLowerCase() === 'accept all') {
            acceptBtn.textContent = 'Accept all';
          }
          var declineBtn = document.getElementById('CybotCookiebotDialogBodyButtonDecline') ||
                           document.getElementById('CybotCookiebotDialogBodyLevelButtonLevelOptinDeclineAll');
          if (declineBtn && declineBtn.textContent.trim().toLowerCase() === 'essential only') {
            declineBtn.textContent = 'Essential only';
          }

          // Move "Show details" directly inside the text paragraph so it NEVER wraps on a second line
          var textP = document.querySelector('#CybotCookiebotDialogBodyContentText p') || 
                      document.getElementById('CybotCookiebotDialogBodyContentText');
          var detailsLink = document.getElementById('CybotCookiebotDialogBodyEdgeMoreDetailsLink') ||
                            document.querySelector('#CybotCookiebotDialogBodyEdgeMoreDetails a') ||
                            document.querySelector('.CybotCookiebotDialogBodyBottomWrapper a');

          if (textP && detailsLink && !textP.contains(detailsLink)) {
            var space = document.createTextNode(' ');
            textP.appendChild(space);
            textP.appendChild(detailsLink);
          }

          // Redirect "Show details" link to /policy
          if (detailsLink && !detailsLink.dataset.redirectBound) {
            detailsLink.dataset.redirectBound = 'true';
            detailsLink.setAttribute('href', '/policy');
            detailsLink.addEventListener('click', function(e) {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();
              window.location.href = '/policy';
            }, true);
          }

          // Ensure close button sits in contentWrapper on mobile (top-right), and in buttonsWrapper on desktop
          var closeBtn = document.getElementById('CybotCookiebotBannerCloseButtonE2E') ||
                         dialog.querySelector('.CybotCookiebotBannerCloseButton');
          var contentWrapper = dialog.querySelector('.CybotCookiebotDialogContentWrapper') || dialog;
          var buttonsWrapper = document.getElementById('CybotCookiebotDialogBodyButtons') ||
                               document.getElementById('CybotCookiebotDialogBodyButtonsWrapper') ||
                               document.getElementById('CybotCookiebotDialogFooter');

          if (closeBtn) {
            if (window.innerWidth >= 768) {
              if (buttonsWrapper && !buttonsWrapper.contains(closeBtn)) {
                buttonsWrapper.appendChild(closeBtn);
              }
            } else {
              if (contentWrapper && closeBtn.parentNode !== contentWrapper) {
                contentWrapper.appendChild(closeBtn);
              }
            }
          }
        }

        window.addEventListener('CookiebotOnDialogDisplay', setupCookiebotBanner);
        window.addEventListener('CookiebotOnLoad', setupCookiebotBanner);
        window.addEventListener('resize', setupCookiebotBanner);
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setupCookiebotBanner);
        } else {
          setupCookiebotBanner();
        }
      })();
    </script>
